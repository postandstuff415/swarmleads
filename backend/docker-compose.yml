services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmleads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swarmleads
      POSTGRES_PASSWORD: swarmleads
      POSTGRES_DB: swarmleads
    ports:
      - "5432:5432"
    volumes:
      - swarmleads_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmleads -d swarmleads"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  swarmleads_pgdata:
